name: Deploy

# Two triggers:
#   - push a `v*` tag        → release deploy of that tag
#   - workflow_dispatch      → retry a tagged release
#
# Required repository secrets (Settings → Secrets → Actions):
#   DEPLOY_SSH_KEY   private key authorised on the host
#   DEPLOY_HOST      e.g. example.com
#   DEPLOY_USER      ssh user
#   DEPLOY_APP_DIR   e.g. /srv/hitgo/app
#   DEPLOY_KNOWN_HOSTS  verified known_hosts line for the target
# Required environment variable: HITGO_PUBLIC_ORIGIN (public HTTPS origin).
# The host needs docker compose + passwordless sudo for docker (see docs/DEPLOY.md).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Release tag to deploy, e.g. v0.26.0'
        required: true

concurrency:
  group: deploy-prototype
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prototype
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # full history + tags: scripts/deploy.sh reads the latest tag for the version shown in the UI
          fetch-depth: 0

      - name: Check secrets are configured
        run: |
          for v in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_APP_DIR DEPLOY_KNOWN_HOSTS HITGO_PUBLIC_ORIGIN; do
            if [ -z "${!v}" ]; then echo "::error::missing secret $v"; exit 1; fi
          done
          git describe --tags --exact-match HEAD >/dev/null || {
            echo "::error::deploy requires a release tag at HEAD"; exit 1;
          }
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HITGO_PUBLIC_ORIGIN: ${{ vars.HITGO_PUBLIC_ORIGIN }}

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "SSH_OPTS=-i $HOME/.ssh/deploy_key" >> "$GITHUB_ENV"

      - name: Deploy
        env:
          HITGO_SSH: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          HITGO_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
          HITGO_PUBLIC_ORIGIN: ${{ vars.HITGO_PUBLIC_ORIGIN }}
          SKIP_SMOKE: '1'
        run: |
          scripts/deploy.sh --notice-origin "$HITGO_PUBLIC_ORIGIN" | tee deploy.log
          tail -n 1 deploy.log | python3 -m json.tool > release-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: release-receipt
          path: release-receipt.json
          if-no-files-found: error

      - name: Summary
        run: echo "Verified ${{ github.event.inputs.ref || github.ref_name }} on the public origin; receipt uploaded." >> "$GITHUB_STEP_SUMMARY"
