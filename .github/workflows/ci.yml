name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv lock --check
      - name: Install ffmpeg (enables the integration render test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: uv run pytest -q

  frontend:
    name: Frontend typecheck, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  contract:
    name: Contract consistency
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Warn when API/spec code changes without a contract update
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD)
          api=$(echo "$changed" | grep -E '^backend/app/(schemas|routers)/|^backend/app/schemas.py|^frontend/src/(types|api).ts' || true)
          contract=$(echo "$changed" | grep -E '^docs/CONTRACT.md' || true)
          if [ -n "$api" ] && [ -z "$contract" ]; then
            echo "::warning::API/spec files changed but docs/CONTRACT.md did not. Confirm no contract change is needed:"
            echo "$api"
          else
            echo "contract check ok"
          fi

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hitgo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
