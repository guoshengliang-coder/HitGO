[project]
name = "hitgo-backend"
version = "0.1.0"
description = "HitGO prototype backend: FastAPI API + Celery render worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "python-multipart>=0.0.9",
    "pillow>=10.3",
    "dashscope>=1.27.5",
]

[project.optional-dependencies]
# Only the separator worker image installs these (Dockerfile.separator): torch on the CPU
# plus Demucs for vocals / instrumental separation (contract §6).
separate = [
    "demucs>=4.1",
    "torch>=2.4",
    "torchaudio>=2.4",
    "numpy>=1.26",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
# Lock only for the platforms we run on (the Linux image, Apple-silicon dev Macs): demucs
# pins an old torch on Intel Macs and would otherwise make the whole lock unsolvable.
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'"]

# Linux (the Docker image) takes the CPU-only torch wheels: ~200 MB instead of the multi-GB
# CUDA build. macOS falls through to PyPI, which is CPU-only there anyway.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
