services:
  api:
    build:
      context: .
      args:
        HITGO_BUILD_SHA: ${HITGO_BUILD_SHA:-unknown}
        HITGO_BUILD_VERSION: ${HITGO_BUILD_VERSION:-dev}
    image: hitgo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
      # Builtin assets are seeded from here on startup; a bind mount means new
      # stickers/fonts only need a restart, not an image rebuild.
      - ./samples:/app/samples:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: hitgo:latest
    restart: unless-stopped
    command: >
      uv run --no-sync celery -A app.worker worker
      --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}
    env_file: .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - api

  # Vocals / instrumental separation (torch + Demucs, CPU). Only consumes the `separate`
  # queue; the first build downloads ~300 MB of wheels and the model weights.
  separator:
    build:
      context: .
      dockerfile: Dockerfile.separator
    image: hitgo-separator:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
      SEPARATE_THREADS: ${SEPARATE_THREADS:-4}
      SEPARATE_MAX_SECONDS: ${SEPARATE_MAX_SECONDS:-600}
    # One 30 s clip peaks around 2–3 GiB on htdemucs; the cap keeps a runaway job from
    # taking the shared host down (swap absorbs brief spikes).
    mem_limit: 5g
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
