services:
  api:
    build: .
    image: hitgo:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8790:8000"
    env_file: .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
      # Builtin assets are seeded from here on startup; a bind mount means new
      # stickers/fonts only need a restart, not an image rebuild.
      - ./samples:/app/samples:ro
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: hitgo:latest
    restart: unless-stopped
    command: >
      uv run --no-sync celery -A app.worker worker
      --loglevel=info --concurrency=${WORKER_CONCURRENCY:-1}
    env_file: .env
    environment:
      DATA_DIR: /data
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./data:/data
    depends_on:
      - redis
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
