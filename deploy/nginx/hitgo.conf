# HitGO edge config for mrlgs.net — installed at /etc/nginx/conf.d/hitgo.conf
#
# Mirrors missiongo.conf on the same host: the public hostname resolves to
# Cloudflare, so only Cloudflare's published ranges may reach this origin, and
# CF-Connecting-IP is trusted as the visitor address. The TLS files are the
# shared copies maintained by the certbot deploy hook for hermes-edge.
#
# Cloudflare ranges from https://www.cloudflare.com/ips-v4 and /ips-v6
# (same snapshot as missiongo.conf, fetched 2026-09-05).

map $http_cf_connecting_ip $hitgo_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hitgo.mrlgs.net;

    ssl_certificate /etc/hermes-edge/tls/fullchain.pem;
    ssl_certificate_key /etc/hermes-edge/tls/privkey.pem;

    # Video uploads: a batch of 8 vertical clips can be well over 100 MB.
    client_max_body_size 2g;

    allow 127.0.0.1;
    allow ::1;
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $hitgo_client_ip;
        proxy_set_header X-Forwarded-For $hitgo_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        # Stream uploads straight to the app and let long renders/downloads
        # run without nginx cutting them off.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
